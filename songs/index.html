<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" type="image/png" sizes="48x48" href="/assets/sidebar/IconMusic.png">

		<title>GoofyBox - Music</title>
		
		<link rel="stylesheet" href="/global.css">
		<link rel="stylesheet" href="/songs/style.css">
		<link rel="stylesheet" href="/songs/new_style.css">
		
		<script src="/global.js" defer></script>
		<script src="/songs/songs.js" defer></script>
		<script src="/songs/player.js" defer></script>
		<script src="/songs/script.js" defer></script>

		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=play_arrow,repeat,repeat_on,skip_next,skip_previous" />
	</head>
	<body>
		<img class="mainLogo" src="/assets/main/LogoPurple.png" alt="GoofyBox Studios Logo" draggable="false">

		<div class="content">
			<h1>Music</h1>

			<div id="albums">
			</div>
			</div>
			<br><br><br>
			<button id="random">
				Random Song
			</button>
		</div>
		
		<iframe src="/notfound.html"></iframe>
		<br><br><br><br><br><br><br><br><br><br>
		
		<div class="musicPlayer" id="musicPlayerElement">
			<div id="playerProgress">
				<div id="playerProgressValue"></div>
			</div>
			<span id="playerPrev" class="material-symbols-outlined">skip_previous</span>
			<span id="playerPlay" class="material-symbols-outlined">play_arrow</span>
			<span id="playerNext" class="material-symbols-outlined">skip_next</span>
			<span id="playerLoop" class="material-symbols-outlined">repeat</span>
			<div id="playerState">Nothing Playing</div>
			<img id="playerEdit" src="/assets/player/Music.png" alt="edit song" draggable="false">
		</div>

		<footer>
			<p class="legal">
				This music is licensed under the<br><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License</a>
			</p>
		</footer>
	</body>
</html>
