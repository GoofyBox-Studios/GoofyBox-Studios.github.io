<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rainworld Region Lease</title>

		<link rel="stylesheet" href="/rainworld/lease/style.css" />
		<script src="/rainworld/lease/script.js" defer></script>
	</head>
	<body>
		<h1>Region Lease</h1>

		<div id="columns">
			<div id="left-column column">
				<div id="bar">
					<input type="text" id="acronym">
		
					<label for="suggest-acronyms">Suggest Acronyms:</label>
					<input type="checkbox" id="suggest-acronyms" />
		
					<label for="show-unused">Show Unused:</label>
					<input type="checkbox" id="show-unused" />
				</div>

				<div id="acronymResults">
					<p class="loading">Loading...</p>
				</div>
			</div>


			<div id="right-column column">
				<div id="bar">
				</div>

				<div id="paletteResults">
					<p class="loading">Loading...</p>
				</div>
			</div>
		</div>

		<div id="popup" class=hidden>
			<div class="header state-0">
				<h1>
					SU - Outskirts
				</h1>

				<span class="bubble">Released (1.9)</span>
				<button onclick="closePopup()">X</button>
			</div>

			<div class="content">
				<div class="section">
					<h2>Author</h2>
					<ul id="author">
					</ul>
				</div>

				<div class="section">
					<h2>Subregions</h2>
					<ul id="subregions">
					</ul>
				</div>

				<div class="section">
					<h2>Connections</h2>
					<ul id="connections">
					</ul>
				</div>
			</div>
		</div>
	</body>
</html>
